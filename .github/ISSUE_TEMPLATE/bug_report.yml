name: Bug report
description: Something in Genvas is broken or behaves wrong
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: input
    id: version
    attributes:
      label: Genvas version
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options:
        - "macOS"
        - "Windows"
        - "Linux"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Drag files in here. Remove API keys from anything you paste.
